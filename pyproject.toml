[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dns-race-lab"
version = "0.2.0"
description = "Race Do53/DoT/DoH resolvers, diff their answers and flag suspicious replies — standard library only"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "chaojiman" }]
keywords = ["dns", "doh", "resolver", "benchmark", "asyncio", "pollution"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: Name Service (DNS)",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/chaojiman/dns-race-lab"
Issues = "https://github.com/chaojiman/dns-race-lab/issues"

[project.scripts]
dnsrace = "dnsrace.cli:main"

[tool.setuptools.packages.find]
include = ["dnsrace*"]